name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install lint tools
        run: pip install black ruff mypy
      - name: Black formatting check
        run: python -m black --check src/ tests/
      - name: Ruff linting
        run: python -m ruff check src/ tests/
      - name: mypy type check
        run: python -m mypy src/ --no-error-summary

  test-linux:
    name: Linux Unit Tests (Py ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,gui]"
      - name: Run tests with coverage
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest tests/ -p no:pytest-qt --cov=cortex_unified --cov-report=xml --cov-report=term-missing
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-linux-${{ matrix.python-version }}
          path: coverage.xml
          retention-days: 14

  test-windows:
    name: Windows Integration Tests (Py ${{ matrix.python-version }})
    runs-on: windows-latest
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,gui]"
      - name: Run Full Test Suite on Windows Native
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest tests/ --ignore=tests/test_gui_pages_e2e.py -v
      - name: Run Full Production Diagnostics Suite
        run: python scripts/verify_production_readiness.py
