[build-system]
requires = ["setuptools>=45", "wheel", "setuptools_scm[toml]>=6.2"]
build-backend = "setuptools.build_meta"

[project]
name = "deep-cleaner"
description = "A safe, powerful, cross-platform utility to find and remove empty files and empty folders"
readme = "README.md"
license = {file = "LICENSE"}
authors = [
    {name = "Deep Cleaner Contributors", email = "contributors@deep-cleaner.example.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Utilities",
    "Topic :: System :: Filesystems",
    "Topic :: System :: Systems Administration",
]
requires-python = ">=3.8"
dependencies = [
    "click>=8.0",
    "pyyaml>=6.0",
    "PySide6>=6.0.0",
    "docker>=6.0.0",
    "plotly>=5.0.0",
    "psutil>=5.9.0",
    "babel>=2.12.0",
    "keyring>=24.0.0",
]
dynamic = ["version"]

[project.optional-dependencies]
trash = [
    "send2trash>=1.8.0",
]
progress = [
    "tqdm>=4.64.0",
]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "black>=22.0",
    "flake8>=5.0",
    "mypy>=0.971",
    "pre-commit>=2.20",
]
gui = [
    "PySide6>=6.0.0",
]
all = [
    "deep-cleaner[trash,progress,dev,gui]",
]

[project.urls]
Homepage = "https://github.com/Destroyer-official/deep-cleaner"
Repository = "https://github.com/Destroyer-official/deep-cleaner"
Issues = "https://github.com/Destroyer-official/deep-cleaner/issues"
Documentation = "https://github.com/Destroyer-official/deep-cleaner/blob/main/docs/usage.md"

[project.scripts]
deep-cleaner = "deep_cleaner.cli:main"
deep-cleaner-gui = "deep_cleaner.gui_app:main"

[tool.setuptools_scm]
write_to = "src/deep_cleaner/_version.py"
version_scheme = "guess-next-dev"
local_scheme = "dirty-tag"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[tool.black]
line-length = 88
target-version = ['py38', 'py39', 'py310', 'py311']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--verbose",
    "--cov=deep_cleaner",
    "--cov-report=html",
    "--cov-report=term-missing",
]

[tool.mypy]
mypy_path = "src"
check_untyped_defs = true
disallow_any_generics = true
ignore_missing_imports = true
no_implicit_optional = true
show_error_codes = true
strict_equality = true
warn_redundant_casts = true
warn_return_any = true
warn_unreachable = true
warn_unused_configs = true
no_implicit_reexport = true