[build-system]
requires = ["setuptools>=45", "wheel", "setuptools_scm[toml]>=6.2"]
build-backend = "setuptools.build_meta"

[project]
name = "cortex-cleaner"
description = "A professional, safe, and powerful utility to find and remove unnecessary files and folders."
readme = "README.md"
license = {file = "LICENSE"}
authors = [
    {name = "Cortex Cleaner Development Team", email = "dev@cortex-cleaner.example.com"}
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Utilities",
    "Topic :: System :: Filesystems",
]
requires-python = ">=3.8"
dependencies = [
    "click>=8.0",
    "pyyaml>=6.0",
    "psutil>=5.9.0",
]
version = "1.0.0"

[project.optional-dependencies]
trash = ["send2trash>=1.8.0"]
progress = ["tqdm>=4.64.0"]
gui = ["PySide6>=6.0.0"]
docker = ["docker>=6.0.0"]
visualization = ["plotly>=5.15.0"]
parquet = ["pyarrow>=12.0.0"]
all = ["cortex-cleaner[trash,progress,gui,docker,visualization,parquet]"]

[project.urls]
Homepage = "https://github.com/Destroyer-official/Cortex_Cleaner"
Repository = "https://github.com/Destroyer-official/Cortex_Cleaner"

[project.scripts]
cortex = "cortex_unified.engine.cli:main"
cortex-gui = "cortex_unified.ui.premium.app:main"
cortex-cleaner = "cortex_unified.cli.cli:main"
cortex-cleaner-gui = "cortex_unified.ui.launcher:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--verbose", "--cov=cortex_unified"]