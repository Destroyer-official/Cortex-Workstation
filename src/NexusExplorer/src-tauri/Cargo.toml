[package]
name = "nexus-explorer"
version = "0.1.0"
description = "NexusExplorer - the fastest, most reliable file explorer for Windows"
edition = "2021"

[lib]
name = "nexus_explorer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "nexus-cli"
path = "src/bin/nexus-cli.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.11", features = ["protocol-asset"] }
tauri-plugin-single-instance = "2.4"
tauri-plugin-dialog = "2.7"
tauri-plugin-opener = "2.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "sync", "fs", "time", "io-util"] }
notify = "8.2"
notify-debouncer-full = "0.7"
jwalk = "0.8"
trash = "5.2"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
uuid = { version = "1", features = ["v4"] }
parking_lot = "0.12"
thiserror = "2"
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Storage_FileSystem",
  "Win32_System_IO",
  "Win32_System_Ioctl",
  "Win32_System_SystemInformation",
  "Win32_System_Diagnostics_Debug",
] }
